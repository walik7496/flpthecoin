<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yes or No?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .app {
      text-align: center;
    }

    .coin {
      width: 140px;
      height: 140px;
      margin: 24px auto;
      border: 8px solid #d99b16;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ffe17a, #f4b41b);
      box-shadow: 0 8px 0 #b8790b, 0 14px 24px #0002;
      color: #704700;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .coin.flipping {
      animation: flip 1s ease-in-out;
    }

    @keyframes flip {
      0%   { transform: rotateY(0) translateY(0); }
      40%  { transform: rotateY(720deg) translateY(-45px); }
      100% { transform: rotateY(1440deg) translateY(0); }
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      min-height: 1.5em;
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Yes or No?</h1>
    <div class="coin" id="coin" aria-live="polite">?</div>
    <button id="flipButton">Flip the coin</button>
    <p id="result">Make your choice and click the button</p>
  </main>

  <script>
    const coin = document.querySelector("#coin");
    const button = document.querySelector("#flipButton");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      button.disabled = true;
      result.textContent = "The coin is spinning...";
      coin.classList.remove("flipping");

      // Restart the animation each time the button is clicked
      void coin.offsetWidth;
      coin.classList.add("flipping");

      const answer = Math.random() < 0.5 ? "Yes" : "No";

      setTimeout(() => {
        coin.textContent = answer;
        result.textContent = `It landed on: ${answer}!`;
        coin.classList.remove("flipping");
        button.disabled = false;
      }, 1000);
    });
  </script>
</body>
</html>
